name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g. 0.0.13 or 1.0.0-beta.1)"
        required: false
        default: ""
        type: string
      arch:
        description: "Architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - both

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: meta
        name: Determine build version
        run: |
          input="${{ github.event.inputs.version }}"
          if [[ -n "$input" ]]; then
            version="${input#v}"
          else
            version="$(node -p "require('./apps/server/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          github.event.inputs.arch == 'both' && '[
            {"arch":"arm64","runner":"macos-14","label":"arm64"},
            {"arch":"x64","runner":"macos-13","label":"x64"}
          ]' ||
          github.event.inputs.arch == 'x64' && '[
            {"arch":"x64","runner":"macos-13","label":"x64"}
          ]' ||
          '[{"arch":"arm64","runner":"macos-14","label":"arm64"}]'
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build desktop artifact (unsigned)
        shell: bash
        run: |
          bun run dist:desktop:artifact -- \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/latest*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Rename x64 manifest to avoid collision when merging
          if [[ "${{ matrix.arch }}" != "arm64" && -f release-publish/latest-mac.yml ]]; then
            mv release-publish/latest-mac.yml "release-publish/latest-mac-${{ matrix.arch }}.yml"
          fi

          echo "=== Release assets ==="
          ls -lh release-publish/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests (if both arches)
        if: github.event.inputs.arch == 'both'
        run: |
          node scripts/merge-mac-update-manifests.ts \
            release-assets/latest-mac.yml \
            release-assets/latest-mac-x64.yml
          rm -f release-assets/latest-mac-x64.yml

      - name: List final assets
        run: ls -lh release-assets/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve.outputs.version }}
          name: T3 Code v${{ needs.resolve.outputs.version }} (macOS)
          body: |
            macOS build from `custom-baseurl` branch.

            Includes custom Anthropic API proxy support via environment variables.
          prerelease: true
          make_latest: false
          files: |
            release-assets/*
          fail_on_unmatched_files: false
